<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>Sipmate — Meet people nearby</title>
<style>
:root{--ink:#172033;--muted:#697386;--line:#e8eaf2;--brand:#5145e5;--soft:#f2f1ff;--bg:#f7f8fc;--green:#16845b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100dvh;background:white;box-shadow:0 0 35px #1720330b}.top{padding:22px 18px 15px;background:linear-gradient(135deg,#5145e5,#7c3aed);color:#fff}.brand{font-size:27px;font-weight:850;letter-spacing:-1px}.brand span{color:#c4f1e1}.sub{font-size:13px;opacity:.9;margin-top:2px}.privacy{font-size:12px;background:#ffffff20;border:1px solid #ffffff35;border-radius:12px;padding:10px;margin-top:14px;line-height:1.4}.nav{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}.nav button{flex:1;border:0;background:white;color:var(--muted);border-radius:10px;padding:10px 4px;font-size:12px;font-weight:700}.nav button.active{background:var(--soft);color:var(--brand)}main{padding:18px 15px 90px}.heading{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.person{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:white}.avatar{height:115px;display:grid;place-items:center;font-size:48px;background:linear-gradient(135deg,#e7e7ff,#fbe8f2)}.person:nth-child(3n+2) .avatar{background:linear-gradient(135deg,#d8f6eb,#e7f0ff)}.person:nth-child(3n) .avatar{background:linear-gradient(135deg,#fff0d8,#fce0e7)}.pbody{padding:11px}.name{font-weight:800;font-size:15px}.loc{font-size:11px;color:var(--muted);margin-top:3px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.tag{font-size:10px;background:#f0f1f8;border-radius:20px;padding:5px 7px;color:#555e70}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:750;font-size:12px}.primary{background:var(--brand);color:#fff}.secondary{background:var(--soft);color:var(--brand)}.full{width:100%}.section{margin-bottom:23px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.notice{border:1px solid #d8e9df;background:#f0fbf5;color:#205b40;border-radius:13px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:15px}.request,.chatitem{border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px}.request p{font-size:13px;margin:7px 0 12px;color:var(--muted)}.actions{display:flex;gap:8px}.actions button{flex:1}.empty{padding:30px 15px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed #d8dbea;border-radius:14px;margin-top:12px}.profilebox{border:1px solid var(--line);border-radius:16px;padding:15px}.profilebox .field{margin-top:12px}.status{font-size:11px;color:var(--green);font-weight:700}.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:auto;padding:9px 15px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center;backdrop-filter:blur(8px)}.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#172033;color:white;padding:11px 15px;border-radius:12px;font-size:13px;display:none;z-index:10;max-width:90%;text-align:center}.pill{display:inline-block;padding:5px 8px;background:#f2f1ff;color:#5145e5;border-radius:8px;font-size:11px;font-weight:700}@media(min-width:600px){.avatar{height:145px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><div class="app"><header class="top"><div class="brand">sip<span>mate</span> ✦</div><div class="sub">Good conversations start close to home.</div><div class="privacy">🛡️ <b>Your privacy matters.</b> This demo uses sample profiles and does not access your GPS or send data to the internet.</div></header><nav class="nav" aria-label="Main navigation"><button class="active" data-tab="discover">Discover</button><button data-tab="requests">Requests <span id="reqCount"></span></button><button data-tab="chats">Chats</button><button data-tab="profile">My profile</button></nav><main id="main"></main><div class="bottom">SIPMATE DEMO · Sample people only · Not connected to real users yet</div><div class="toast" id="toast" role="status"></div></div>
<script>
const people=[
{id:1,name:'Amani',age:24,area:'Pipeline',km:1.2,emoji:'😊',bio:'Always up for a walk, good food and genuine friendships.',tags:['Walking','Music','Food']},
{id:2,name:'Brian',age:27,area:'Milimani',km:3.4,emoji:'🧑🏽‍🦱',bio:'Football, films and discovering new places around town.',tags:['Football','Movies','Outdoors']},
{id:3,name:'Wanjiku',age:22,area:'Section 58',km:4.8,emoji:'👩🏽',bio:'Book lover who enjoys coffee chats and weekend adventures.',tags:['Books','Coffee','Hiking']},
{id:4,name:'Kevin',age:25,area:'Naka',km:2.1,emoji:'😎',bio:'Learning photography and looking for new friends.',tags:['Photography','Music','Tech']},
{id:5,name:'Zuri',age:23,area:'Lanet',km:7.6,emoji:'👩🏾‍🦱',bio:'Kind people, deep conversations and spontaneous plans.',tags:['Art','Food','Hiking']},
{id:6,name:'Sam',age:29,area:'Kiamunyi',km:8.2,emoji:'🧔🏽',bio:'Fitness, nature and making the most of life.',tags:['Fitness','Nature','Football']}
];
let tab='discover',requests=[],chats=[],sent=[],profile={name:'Your name',age:'25',area:'Nakuru',bio:'Here to make genuine friends.',interests:'Walking, music, food'},filters={area:'All areas',distance:'Any distance',interest:''};
const main=document.getElementById('main');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',2400)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('reqCount').textContent=requests.filter(r=>r.status==='pending').length?`(${requests.filter(r=>r.status==='pending').length})`:'';if(tab==='discover')discover();if(tab==='requests')showRequests();if(tab==='chats')showChats();if(tab==='profile')showProfile()}
function personCard(p){let already=sent.includes(p.id)||chats.some(c=>c.id===p.id);return `<article class="person"><div class="avatar">${p.emoji}</div><div class="pbody"><div class="name">${esc(p.name)}, ${p.age}</div><div class="loc">📍 ${esc(p.area)} · about ${p.km} km away</div><div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="muted" style="min-height:55px">${esc(p.bio)}</div><button class="btn ${already?'secondary':'primary'} full" style="margin-top:10px" onclick="sendRequest(${p.id})" ${already?'disabled':''}>${already?'Request sent ✓':'＋ Request to chat'}</button></div></article>`}
function discover(){let areas=['All areas',...new Set(people.map(p=>p.area))];let list=people.filter(p=>(filters.area==='All areas'||p.area===filters.area)&&(filters.distance==='Any distance'||p.km<=Number(filters.distance))&&(!filters.interest||[...p.tags,p.bio].join(' ').toLowerCase().includes(filters.interest.toLowerCase())));main.innerHTML=`<section class="section"><h1 class="heading">Meet your next friend</h1><div class="muted">Find people by neighbourhood, distance or shared interests.</div></section><div class="notice">📍 <b>Location preview:</b> sample Nakuru areas only. In the live app, you can choose an area manually or allow approximate location. Exact coordinates won't appear on profiles.</div><div class="filters"><div class="field"><label for="area">Neighbourhood</label><select id="area" onchange="filters.area=this.value;discover()">${areas.map(a=>`<option ${a===filters.area?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="field"><label for="distance">Distance</label><select id="distance" onchange="filters.distance=this.value;discover()">${[['Any distance','Any distance'],['2','Within 2 km'],['5','Within 5 km'],['10','Within 10 km']].map(([v,l])=>`<option value="${v}" ${v===filters.distance?'selected':''}>${l}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label for="interest">Interest or hobby</label><input id="interest" value="${esc(filters.interest)}" placeholder="Try hiking, music, books…" oninput="filters.interest=this.value;discover()"></div></div><div class="row" style="margin:15px 0"><b>${list.length} people to discover</b><span class="pill">18+ concept</span></div><div class="cards">${list.length?list.map(personCard).join(''):'<div class="empty" style="grid-column:1/-1">No matching profiles. Try another filter.</div>'}</div>`}
function sendRequest(id){if(sent.includes(id)||chats.some(c=>c.id===id))return;let p=people.find(x=>x.id===id);requests.push({id,status:'pending',message:`Hi ${p.name}! I'd like to connect and make a new friend.`,incoming:false});sent.push(id);toast('Demo request sent to '+p.name);render()}
function showRequests(){let incoming=[{id:101,name:'Alex',age:26,area:'Naka',emoji:'👋',message:'Hey! I saw we both like hiking. Want to chat?',incoming:true,status:'pending'}];let out=requests.filter(r=>!r.incoming);main.innerHTML=`<h1 class="heading">Message requests</h1><p class="muted">Accept a request to open a conversation. You can ignore requests you don't want.</p><h3>Received</h3>${incoming.filter(r=>r.status==='pending').map(r=>`<div class="request"><div class="row"><b>${r.emoji} ${r.name}, ${r.age}</b><span class="pill">New request</span></div><div class="loc">📍 ${r.area} · approximate area</div><p>${esc(r.message)}</p><div class="actions"><button class="btn primary" onclick="acceptIncoming(${r.id})">Accept & chat</button><button class="btn secondary" onclick="toast('Demo: request declined');this.closest('.request').remove()">Decline</button></div></div>`).join('')||'<div class="empty">No incoming requests right now.</div>'}<h3 style="margin-top:24px">Sent</h3>${out.length?out.map(r=>{let p=people.find(x=>x.id===r.id);return `<div class="request"><div class="row"><b>${p.emoji} ${esc(p.name)}</b><span class="status">Waiting for reply</span></div><p>${esc(r.message)}</p><button class="btn secondary" onclick="cancelRequest(${p.id})">Cancel request</button></div>`}).join(''):'<div class="empty">Requests you send will appear here.</div>'}<p class="muted" style="margin-top:14px">The received request is a sample to demonstrate how acceptance works.</p>`}
function acceptIncoming(id){chats.push({id:101,name:'Alex',emoji:'👋',messages:[{from:'Alex',text:'Hey! I saw we both like hiking. Want to chat?'}]});toast('Conversation opened');render();}
function cancelRequest(id){requests=requests.filter(r=>r.id!==id);sent=sent.filter(x=>x!==id);render();toast('Request cancelled')}
function showChats(){main.innerHTML=`<h1 class="heading">Your chats</h1><p class="muted">Conversations open after a message request is accepted.</p>${chats.length?chats.map(c=>`<div class="chatitem" onclick="openChat(${c.id})"><div class="row"><b>${c.emoji} ${esc(c.name)}</b><span class="pill">Open chat →</span></div><div class="muted" style="margin-top:7px">${esc(c.messages[c.messages.length-1]?.text||'Say hello!')}</div></div><div id="chat-${c.id}"></div>`).join(''):'<div class="empty">No conversations yet.<br><br>Explore profiles and send a message request to get started.</div>'}`}
function openChat(id){let c=chats.find(x=>x.id===id);let el=document.getElementById('chat-'+id);if(!el)return;el.innerHTML=`<div class="request"><div style="max-height:220px;overflow:auto">${c.messages.map(m=>`<p><b>${esc(m.from)}:</b> ${esc(m.text)}</p>`).join('')}</div><div class="field"><label>Demo message</label><input id="msg-${id}" placeholder="Write a friendly message…"></div><button class="btn primary full" style="margin-top:8px" onclick="sendChat(${id})">Send message</button></div>`;el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function sendChat(id){let inp=document.getElementById('msg-'+id),v=inp.value.trim();if(!v)return;chats.find(x=>x.id===id).messages.push({from:profile.name||'You',text:v});toast('Demo message added');showChats();openChat(id)}
function showProfile(){main.innerHTML=`<h1 class="heading">My profile</h1><p class="muted">Show a little of your personality. You control what other people can see.</p><div class="profilebox"><div class="row"><div><b>Profile preview</b><div class="muted">Visible details only</div></div><span class="pill">Private by default</span></div><div class="field"><label for="pname">Display name</label><input id="pname" value="${esc(profile.name)}" maxlength="30"></div><div class="filters"><div class="field"><label for="page">Age (18+)</label><input id="page" type="number" min="18" max="99" value="${esc(profile.age)}"></div><div class="field"><label for="parea">Neighbourhood / town</label><input id="parea" value="${esc(profile.area)}" maxlength="50"></div></div><div class="field"><label for="pbio">Short bio</label><textarea id="pbio" rows="3" maxlength="180">${esc(profile.bio)}</textarea></div><div class="field"><label for="pinterests">Interests (comma-separated)</label><input id="pinterests" value="${esc(profile.interests)}" maxlength="120"></div><button class="btn primary full" style="margin-top:14px" onclick="saveProfile()">Save demo profile</button><p class="muted" style="margin-top:12px">This prototype saves only in this open page; it doesn't upload a photo or share your information.</p></div><div class="notice" style="margin-top:15px">Safety tips: use a display name, avoid posting your home address or daily routine, and meet new friends in public places.</div>`}
function saveProfile(){let age=Number(document.getElementById('page').value);if(age<18||age>99){toast('This concept is for adults aged 18+');return}profile={name:document.getElementById('pname').value.trim()||'Friend',age:String(age),area:document.getElementById('parea').value.trim()||'Nakuru',bio:document.getElementById('pbio').value.trim(),interests:document.getElementById('pinterests').value.trim()};toast('Profile saved for this demo');}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));render();
</script></body></html>
